<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pass Citizenship Test — Download the App</title>
<meta name="description" content="Free offline-first study app for the Australian Citizenship Test. Get it on the App Store or Google Play." />

<!-- Open Graph -->
<meta property="og:title" content="Pass Citizenship Test" />
<meta property="og:description" content="Practice the real Australian Citizenship Test, offline, on your phone." />
<meta property="og:image" content="/icon.png" />
<meta property="og:type" content="website" />

<!-- Apple smart banner (opens App Store on iOS Safari) -->
<meta name="apple-itunes-app" content="app-id=6798171743" />

<link rel="icon" href="/icon.png" type="image/png" />
<link rel="apple-touch-icon" href="/icon.png" />

<style>
  :root {
    /* Matches lib/core/theme/app_theme.dart (dark scheme) */
    --bg-1: #07111f;
    --bg-2: #0d1d2d;
    --primary: #7eb6ff;
    --primary-strong: #0d47a1;
    --accent: #ffb74d;
    --ink: #f0f5fc;
    --ink-dim: #9aafc4;
    --card: #112537;
    --card-border: #293c51;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 800px at 50% -10%, var(--bg-2), var(--bg-1) 60%);
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 0 20px;
  }

  main {
    width: 100%;
    max-width: 480px;
    padding: 56px 0 40px;
    text-align: center;
  }

  .icon {
    width: 104px;
    height: 104px;
    border-radius: 24px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    margin-bottom: 20px;
  }

  h1 {
    font-size: 1.6rem;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }

  p.tagline {
    color: var(--ink-dim);
    font-size: 1rem;
    line-height: 1.5;
    margin: 0 0 32px;
  }

  .status {
    display: none;
    font-size: 0.9rem;
    color: var(--ink-dim);
    margin-bottom: 24px;
  }
  .status.visible { display: block; }
  .status a { color: var(--primary); }

  .stores {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 36px;
  }

  .store-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    justify-content: center;
    padding: 14px 20px;
    border-radius: 14px;
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--ink);
    text-decoration: none;
    font-weight: 600;
    font-size: 1rem;
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .store-btn:hover { background: rgba(255, 255, 255, 0.08); transform: translateY(-1px); }
  .store-btn:active { transform: translateY(0); }

  .store-btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #2b1600;
  }
  .store-btn.primary:hover { background: #ffa733; }

  .store-btn svg { width: 22px; height: 22px; flex-shrink: 0; }

  .store-btn .label {
    text-align: left;
    line-height: 1.2;
  }

  .qr-section {
    display: none;
    justify-content: center;
    margin-bottom: 8px;
  }

  .qr-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 18px;
    display: inline-block;
  }

  .qr-card img {
    width: 176px;
    height: 176px;
    display: block;
    border-radius: 8px;
    background: #fff;
  }

  .qr-card span {
    display: block;
    margin-top: 10px;
    font-size: 0.8rem;
    color: var(--ink-dim);
  }

  @media (min-width: 560px) {
    .qr-section.visible { display: flex; }
  }

  footer {
    margin-top: 40px;
    font-size: 0.78rem;
    color: rgba(243, 247, 244, 0.45);
  }
</style>
</head>
<body>
<main>
  <img class="icon" src="/icon.png" alt="Pass Citizenship Test app icon" />
  <h1>Pass Citizenship Test</h1>
  <p class="tagline">Study for the real Australian Citizenship Test — offline, on your phone, free.</p>

  <p id="status" class="status">Opening the store… <a href="#" id="status-cancel">stay on this page</a></p>

  <div class="stores">
    <a id="app-store-btn" class="store-btn" href="https://apps.apple.com/us/app/pass-citizenship-test/id6798171743" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.365 1.43c0 1.14-.415 2.19-1.24 3.02-.902.918-2.008 1.45-3.116 1.36-.09-1.1.42-2.24 1.24-3.02.86-.85 2.16-1.44 3.116-1.36zm3.53 16.6c-.48 1.1-.71 1.59-1.33 2.56-.87 1.36-2.1 3.05-3.62 3.06-1.35.02-1.7-.88-3.53-.87-1.83.01-2.22.89-3.57.87-1.52-.02-2.68-1.55-3.55-2.91-2.43-3.77-2.69-8.2-1.19-10.56.06-.1.13-.19.2-.28C4.15 8.05 5.9 7.1 7.6 7.08c1.32-.02 2.56.9 3.36.9.8 0 2.3-1.11 3.88-.95.66.03 2.52.27 3.72 2.02-.1.06-2.22 1.3-2.19 3.87.03 3.08 2.7 4.1 2.73 4.11z"/></svg>
      <span class="label">Download on the<br><b style="font-size:1.05em">App Store</b></span>
    </a>
    <a id="play-store-btn" class="store-btn" href="https://play.google.com/store/apps/details?id=com.hashamahmad.pass_citizenship_test" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.6 2.6c-.35.35-.55.85-.55 1.45v15.9c0 .6.2 1.1.55 1.45l.1.08L13 12.2v-.4L3.7 2.5l-.1.1z"/><path d="M16.3 15.5l-3.3-3.3v-.4l3.3-3.3 3.94 2.24c1.12.64 1.12 1.68 0 2.32L16.3 15.5z" fill-opacity=".7"/><path d="M16.3 15.5L13 12.2 3.7 21.5c.36.38.96.42 1.63.05l10.97-6.05z"/><path d="M16.3 8.5L5.33 2.45C4.66 2.08 4.06 2.12 3.7 2.5L13 12.2l3.3-3.7z" fill-opacity=".85"/></svg>
      <span class="label">Get it on<br><b style="font-size:1.05em">Google Play</b></span>
    </a>
  </div>

  <div id="qr-section" class="qr-section">
    <div class="qr-card">
      <img id="qr-img" src="" alt="QR code to open this page on your phone" loading="lazy" />
      <span>Scan with your phone</span>
    </div>
  </div>

  <footer>&copy; <span id="year"></span> Pass Citizenship Test</footer>
</main>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  var APP_STORE_URL = document.getElementById('app-store-btn').href;
  var PLAY_STORE_URL = document.getElementById('play-store-btn').href;

  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/.test(ua) && !window.MSStream;
  var isAndroid = /Android/.test(ua);

  if (isIOS || isAndroid) {
    var target = isIOS ? APP_STORE_URL : PLAY_STORE_URL;
    document.getElementById(isIOS ? 'app-store-btn' : 'play-store-btn').classList.add('primary');

    var statusEl = document.getElementById('status');
    statusEl.classList.add('visible');

    var redirected = false;
    var cancelBtn = document.getElementById('status-cancel');
    cancelBtn.addEventListener('click', function (e) {
      e.preventDefault();
      redirected = true; // suppress the pending redirect
      statusEl.classList.remove('visible');
    });

    setTimeout(function () {
      if (!redirected) window.location.href = target;
    }, 600);
  } else {
    // The QR encodes this page itself, not a store link directly — whoever
    // scans it lands here and gets redirected by the platform check above.
    var qrData = encodeURIComponent(window.location.href.split('#')[0]);
    document.getElementById('qr-img').src =
      'https://api.qrserver.com/v1/create-qr-code/?size=352x352&data=' + qrData;
    document.getElementById('qr-section').classList.add('visible');
  }
</script>
</body>
</html>
